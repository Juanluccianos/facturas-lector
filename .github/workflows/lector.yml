# Lector de facturas de proveedores — Lucciano's
name: Lector de facturas

on:
  schedule:
    - cron: '0 11-23 * * 1-5'   # UTC → respaldo: una vez por hora, 08:00 a 20:00 hora argentina, lunes a viernes (lo normal es que lo dispare el Worker)
  workflow_dispatch:

concurrency:
  group: lector-facturas
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Leer facturas pendientes
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          LECTOR_SECRET: ${{ secrets.LECTOR_SECRET }}
          GEMINI_GATEWAY_URL: ${{ secrets.GEMINI_GATEWAY_URL }}
          GEMINI_GATEWAY_SECRET: ${{ secrets.GEMINI_GATEWAY_SECRET }}
        run: python lector.py
